name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gestionlocative
          POSTGRES_PASSWORD: gestionlocative
          POSTGRES_DB: gestionlocative_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gestionlocative:gestionlocative@localhost:5432/gestionlocative_test
      DATABASE_URL_TEST: postgresql://gestionlocative:gestionlocative@localhost:5432/gestionlocative_test
      NEXTAUTH_SECRET: ci-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Appliquer les migrations sur la base de test
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Tests d'intégration
        run: npm run test:integration

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/gestionlocative
            git pull origin main
            npm ci
            npx prisma migrate deploy
            npm run build
            pm2 restart gestionlocative
